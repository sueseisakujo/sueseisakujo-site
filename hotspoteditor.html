<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホットスポット位置エディタ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background:#1a1a1a; }

  .hero-wrap {
    position: relative;
    width: 100%;
    max-width: 1920px;
    margin: 0 auto;
  }
  .hero-wrap img.hero-img {
    width: 100%;
    display: block;
  }

  .hotspot {
    position: absolute;
    cursor: grab;
    padding: 6px 12px;
    border-radius: 4px;
    background: rgba(20,16,12,0.55);
    outline: 1px dashed rgba(255,255,255,0.5);
    user-select: none;
    touch-action: none;
  }
  .hotspot:active { cursor: grabbing; background: rgba(224,112,68,0.65); }
  .hotspot.dragging { background: rgba(224,112,68,0.75); outline: 2px solid #fff; z-index: 50; }
  .hotspot-label {
    font-size: 13px; color: #fff; font-weight: 300; letter-spacing: 0.04em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7); display: block; pointer-events:none;
  }
  .hotspot-sub {
    font-size: 11px; color: rgba(255,255,255,0.8);
    text-shadow: 0 1px 3px rgba(0,0,0,0.7); display: block; margin-top: 2px; pointer-events:none;
  }

  #panel {
    position: fixed;
    top: 16px; right: 16px;
    width: 340px;
    max-height: 92vh;
    overflow-y: auto;
    background: rgba(20,20,15,0.95);
    color: #f4f1e9;
    padding: 18px 20px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.7;
    z-index: 999;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  #panel h3 { font-size: 14px; margin-bottom: 10px; }
  #panel .item { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid rgba(244,241,233,0.15); }
  #panel .item b { color: #e8c878; }
  #panel code { display:block; background:rgba(0,0,0,0.3); padding:6px 8px; border-radius:4px; margin-top:4px; font-size:11px; word-break:break-all; }
  #panel .hint { color:#cfcab0; font-size:11px; margin-top:14px; }
</style>
</head>
<body>

<div class="hero-wrap" id="heroWrap">
  <img class="hero-img" src="https://www.sueseisakujo.com/hero-entrance.jpeg" alt="スエ製作所 施工写真">

  <a class="hotspot" data-id="cove" data-href="room-cove0607.html"
     style="left:calc(840/1920*100% - 60px); top:calc(108/1080*100% - 16px);">
    <span class="hotspot-label">コーブ照明</span>
    <span class="hotspot-sub">Cove Lighting</span>
  </a>

  <a class="hotspot" data-id="hokusai" data-href="room-hokusai0607.html"
     style="left:calc(396/1920*100% - 100px); top:calc(30.3% - 16px);">
    <span class="hotspot-label">葛飾北斎「神奈川県沖浪裏」</span>
    <span class="hotspot-sub">3Dプリンター製 組子アート</span>
  </a>

  <a class="hotspot" data-id="sash" data-href="room-sash0607.html"
     style="left:calc(72.8% - 80px); top:calc(63.7% - 16px);">
    <span class="hotspot-label">大開口トリプルサッシ</span>
    <span class="hotspot-sub">Triple-glazed Sliding Door</span>
  </a>

  <a class="hotspot" data-id="table" data-href="room-table0607.html"
     style="left:calc(50.1% - 80px); top:calc(70.4% - 16px);">
    <span class="hotspot-label">壁一体タイルテーブル</span>
    <span class="hotspot-sub">Built-in Tile Table</span>
  </a>

  <a class="hotspot" data-id="desk" data-href="room-desk0607.html"
     style="left:calc(92.3% - 60px); top:calc(63.7% - 16px);">
    <span class="hotspot-label">柱無しデスク</span>
    <span class="hotspot-sub">Pillar-free Desk</span>
  </a>

  <a class="hotspot" data-id="ac" data-href="room-ac0607.html"
     style="left:calc(29.9% - 60px); top:calc(79.5% - 16px);">
    <span class="hotspot-label">床上エアコン</span>
    <span class="hotspot-sub">Floor-level Air Conditioning</span>
  </a>
</div>

<div id="panel">
  <h3>ラベル位置エディタ</h3>
  <div class="hint">各ラベルをドラッグして好きな位置に動かしてください。下に現在の座標(%)が自動更新されます。終わったら全部のコードをまとめてコピーして教えてください。</div>
  <div id="coords" style="margin-top:14px;"></div>
</div>

<script>
  const wrap = document.getElementById('heroWrap');
  const hotspots = document.querySelectorAll('.hotspot');
  const coordsPanel = document.getElementById('coords');
  const labels = {
    cove: 'コーブ照明',
    hokusai: '葛飾北斎',
    sash: '大開口トリプルサッシ',
    table: '壁一体タイルテーブル',
    desk: '柱無しデスク',
    ac: '床上エアコン'
  };

  let dragTarget = null;
  let offsetX = 0, offsetY = 0;

  hotspots.forEach(el => {
    el.addEventListener('pointerdown', e => {
      dragTarget = el;
      el.classList.add('dragging');
      const rect = el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (dragTarget !== el) return;
      const wrapRect = wrap.getBoundingClientRect();
      let x = e.clientX - wrapRect.left - offsetX;
      let y = e.clientY - wrapRect.top - offsetY;
      // convert to % of wrap size, anchored at element's own left/top (not center)
      const pctX = (x / wrapRect.width) * 100;
      const pctY = (y / wrapRect.height) * 100;
      el.style.left = pctX.toFixed(2) + '%';
      el.style.top = pctY.toFixed(2) + '%';
      updateCoords();
    });
    el.addEventListener('pointerup', e => {
      if (dragTarget === el) {
        dragTarget = null;
        el.classList.remove('dragging');
      }
    });
  });

  function updateCoords(){
    let html = '';
    hotspots.forEach(el => {
      const id = el.dataset.id;
      const left = el.style.left;
      const top = el.style.top;
      html += `<div class="item"><b>${labels[id]}</b><code>left:${left}; top:${top};</code></div>`;
    });
    coordsPanel.innerHTML = html;
  }
  updateCoords();
</script>

</body>
</html>
